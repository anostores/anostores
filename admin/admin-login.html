<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الدخول والاعتماد | ANO Store Admin</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../images/favicon.png">

  <!-- Bootstrap 5 RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  
  <!-- FontAwesome 6 JS SVG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous"></script>

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Custom Admin CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin-style.css">
</head>
<body class="admin-body d-flex align-items-center justify-content-center min-vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <div class="card border-0 shadow-lg p-4 rounded-4 bg-white">
          
          <div class="text-center mb-3">
            <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle p-3 mb-2">
              <i class="fa-solid fa-user-shield fa-2x"></i>
            </div>
            <h5 class="fw-bold m-0">لوحة تحكم ANO Store</h5>
            <span class="text-muted small">تسجيل الدخول / طلب انضمام أدمن جديد</span>
          </div>

          <!-- التبويبات -->
          <ul class="nav nav-pills nav-justified mb-4" id="pills-tab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active fw-bold small" id="pills-admin-login-tab" data-bs-toggle="pill" data-bs-target="#pills-admin-login" type="button">تسجيل الدخول</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link fw-bold small" id="pills-admin-reg-tab" data-bs-toggle="pill" data-bs-target="#pills-admin-reg" type="button">طلب حساب أدمن جديد</button>
            </li>
          </ul>

          <div class="tab-content" id="pills-tabContent">
            
            <!-- 1. تسجيل الدخول -->
            <div class="tab-pane fade show active" id="pills-admin-login" role="tabpanel">
              <form id="admin-login-form">
                <div class="mb-3">
                  <label class="form-label fw-bold small">البريد الإلكتروني <span class="text-danger">*</span></label>
                  <input type="email" class="form-control form-control-sm" id="admin-login-email" required placeholder="iamhondv@gmail.com">
                </div>

                <div class="mb-3">
                  <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label fw-bold small mb-0">كلمة المرور <span class="text-danger">*</span></label>
                    <button type="button" class="btn btn-link p-0 text-danger small fw-bold text-decoration-none" data-bs-toggle="modal" data-bs-target="#resetPasswordModal">
                      نسيت كلمة السر؟
                    </button>
                  </div>
                  <input type="password" class="form-control form-control-sm mt-1" id="admin-login-password" required placeholder="******">
                </div>

                <div class="mb-3 form-check text-start">
                  <input type="checkbox" class="form-check-input" id="admin-remember-me">
                  <label class="form-check-label small fw-bold" for="admin-remember-me">تذكرني على هذا الجهاز</label>
                </div>

                <button type="submit" class="btn btn-ano-primary w-100 fw-bold py-2 shadow-sm" id="btn-admin-login">
                  دخول cPanel <i class="fa-solid fa-right-to-bracket ms-1"></i>
                </button>
              </form>
            </div>

            <!-- 2. إنشاء / طلب حساب أدمن جديد -->
            <div class="tab-pane fade" id="pills-admin-reg" role="tabpanel">
              <form id="admin-register-form">
                <div class="mb-3">
                  <label class="form-label fw-bold small">الاسم بالكامل <span class="text-danger">*</span></label>
                  <input type="text" class="form-control form-control-sm" id="admin-reg-name" required placeholder="اسم الأدمن بالكامل">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold small">البريد الإلكتروني <span class="text-danger">*</span></label>
                  <input type="email" class="form-control form-control-sm" id="admin-reg-email" required placeholder="admin@example.com">
                </div>

                <div class="mb-3">
                  <label class="form-label fw-bold small">كلمة المرور <span class="text-danger">*</span></label>
                  <input type="password" class="form-control form-control-sm" id="admin-reg-password" required placeholder="******">
                </div>

                <button type="submit" class="btn btn-danger w-100 fw-bold py-2 shadow-sm" id="btn-admin-register">
                  إرسال الطلب للسوبر أدمن <i class="fa-solid fa-paper-plane ms-1"></i>
                </button>
              </form>
            </div>

          </div>

          <hr class="my-3">

          <div class="text-center">
            <a href="../index.html" class="text-muted small text-decoration-none">
              <i class="fa-solid fa-arrow-right me-1"></i> العودة للمتجر
            </a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Modal استعادة كلمة السر (Password Reset Modal) -->
  <div class="modal fade" id="resetPasswordModal" tabindex="-1" aria-labelledby="resetPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom-0 pb-0">
          <h6 class="modal-title fw-bold text-danger" id="resetPasswordModalLabel"><i class="fa-solid fa-key me-2"></i> استعادة كلمة السر للأدمن</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-3">
          <p class="text-muted small mb-3">أدخل بريدك الإلكتروني المسجل في لوحة التحكم، وسنقوم بإرسال رابط إعادة تعيين كلمة السر الخاصة بك فوراً عبر Supabase Auth.</p>
          <form id="admin-reset-password-form">
            <div class="mb-3">
              <label class="form-label fw-bold small">البريد الإلكتروني للأدمن <span class="text-danger">*</span></label>
              <input type="email" class="form-control form-control-sm" id="admin-reset-email" required placeholder="iamhondv@gmail.com">
            </div>
            <button type="submit" class="btn btn-danger btn-sm w-100 fw-bold py-2" id="btn-reset-password">
              إرسال رابط إعادة التعيين <i class="fa-solid fa-paper-plane ms-1"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/admin-auth.js"></script>
</body>
</html>
